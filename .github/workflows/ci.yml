name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (Java 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Generate SBOM (CycloneDX)
        run: mvn -B -ntp -DskipTests org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: '**/target/*.xml'
          if-no-files-found: warn

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# NOTE: SAST (SpotBugs + Find Security Bugs) is temporarily disabled — its bundled
# ASM does not yet read Java 25 bytecode (class file major version 69). It will be
# re-enabled when SpotBugs ships Java 25 support. In the meantime the REST security
# architecture test (in the build job) and gitleaks provide security coverage.
